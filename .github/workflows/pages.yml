name: pages

# The documentation site is its own tree under site/, so it gates and
# publishes on its own and never waits for a core lane. Publishing needs
# Pages, which a private repository on this plan does not get, so those
# steps stand down until the repository is public.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  # Fires the moment the repository changes from private to public, which is
  # when Pages becomes available again and the site should come back on its own.
  public:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      publishable: ${{ steps.site.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.0
      - name: install
        working-directory: site
        run: bun install --frozen-lockfile
      - name: check
        working-directory: site
        run: bun run check
      - name: build
        working-directory: site
        run: bun run build
      - name: browsers
        working-directory: site
        run: bunx playwright install --with-deps chromium firefox webkit
      - name: test
        working-directory: site
        run: bun run test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: site/playwright-report
          retention-days: 7
      # The event payload carries the visibility as it was when the event fired,
      # which is stale if the repository flipped since. Ask for the live answer.
      - name: visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          public=false
          if [ "${{ github.event_name }}" != "pull_request" ] &&
             [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" = "public" ]; then
            public=true
          fi
          echo "public=$public" >> "$GITHUB_OUTPUT"

      # Going private deletes the Pages site, so going public again needs it
      # created. The workflow token can do that only where the repository's
      # workflow permissions are read and write; where it cannot, this stands
      # down with a warning rather than failing the lane.
      - name: pages site
        id: site
        if: steps.visibility.outputs.public == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif gh api -X POST "repos/$GITHUB_REPOSITORY/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is not enabled and this token may not create it. Run: gh api -X POST repos/$GITHUB_REPOSITORY/pages -f build_type=workflow"
          fi
      - uses: actions/configure-pages@v5
        if: steps.site.outputs.ready == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.site.outputs.ready == 'true'
        with:
          path: site/dist

  deploy:
    needs: build
    if: needs.build.outputs.publishable == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
